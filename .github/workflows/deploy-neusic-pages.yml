name: Deploy Neusic Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: neusic-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare production site
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/studio _site/wave-loom _site/live-loop
          mkdir -p _site/css/landing _site/css/shared
          mkdir -p _site/scripts/landing _site/scripts/shared
          mkdir -p _site/assets/icons

          cp index.html _site/index.html
          cp -R css/landing/. _site/css/landing/
          cp -R css/shared/. _site/css/shared/
          cp -R scripts/landing/. _site/scripts/landing/
          cp -R scripts/shared/. _site/scripts/shared/

          # Restore the exact approved circular campaign logo from the preserved
          # working teaser commit. This avoids relying on video autoplay or a
          # Studio-relative fallback path.
          git show 11c5c82d895984db7c1bbfd4760125e2641bdfd6:assets/icons/neusicwave-campaign-logo.jpg > _site/assets/icons/neusicwave-campaign-logo.jpg
          test -s _site/assets/icons/neusicwave-campaign-logo.jpg

          cp -R app/. _site/studio/
          cp -R wave-loom/. _site/wave-loom/
          cp -R live-loop/. _site/live-loop/

          if [ -f CNAME ]; then cp CNAME _site/CNAME; fi
          if [ -f favicon.ico ]; then cp favicon.ico _site/favicon.ico; fi
          if [ -f apple-touch-icon.png ]; then cp apple-touch-icon.png _site/apple-touch-icon.png; fi

          mv _site/studio/index.html _site/studio/core.html
          mv _site/studio/phase-a.html _site/studio/index.html

          touch _site/.nojekyll
          touch _site/studio/.nojekyll
          touch _site/wave-loom/.nojekyll
          touch _site/live-loop/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
