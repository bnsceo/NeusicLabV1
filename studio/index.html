<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#171917"><title>Neusic Studio — Arrangement</title>
<style>
:root{color-scheme:dark;--bg:#171917;--panel:#202320;--panel2:#252925;--line:#343a34;--text:#ecefe9;--muted:#a1a99f;--soft:#747d73;--accent:#c5d36a;--cyan:#84c7c4;--violet:#b9a0d9;--orange:#e4a46e;--trackH:94px;--labelW:190px;--barW:112px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:13px/1.4 Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;overflow:hidden}button,input{font:inherit;color:inherit}button{background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:8px 12px;cursor:pointer}button:hover{border-color:#697164;background:#2c312b}button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}.app{height:100dvh;display:flex;flex-direction:column;min-width:760px}.top{height:52px;display:flex;align-items:center;gap:20px;padding:0 18px;border-bottom:1px solid var(--line);background:#1c1f1c}.brand{font-weight:750;letter-spacing:.12em;font-size:12px}.brand i{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--accent);margin-right:9px}.project-name{color:var(--muted);border-left:1px solid var(--line);padding-left:18px}.top-spacer{flex:1}.saved{color:var(--soft);font-size:11px}.top .subtle{background:transparent}.transport{height:76px;display:flex;align-items:center;justify-content:center;gap:10px;border-bottom:1px solid var(--line);background:#202320}.transport button{min-width:42px;height:38px}.transport .play{background:var(--accent);color:#20231a;border-color:var(--accent);font-weight:750;min-width:62px}.transport .record{color:#e67968}.readout{min-width:94px;text-align:center;font-variant-numeric:tabular-nums}.readout b{font-size:18px;letter-spacing:.03em}.readout small{display:block;color:var(--muted);font-size:9px;letter-spacing:.12em}.tempo{width:66px;padding:8px 4px;text-align:center;border:1px solid var(--line);border-radius:6px;background:var(--panel)}.tempo-label{color:var(--muted);font-size:10px}.tools{height:46px;display:flex;align-items:center;gap:8px;padding:0 14px;border-bottom:1px solid var(--line);background:#1c1f1c}.tools .primary{background:var(--accent);color:#22261b;border-color:var(--accent);font-weight:700}.tools .import{color:var(--text)}.tools .right{margin-left:auto;color:var(--muted);font-size:11px}.workspace{display:grid;grid-template-columns:var(--labelW) minmax(0,1fr);flex:1;min-height:0}.left,.arrange{min-height:0;overflow:auto}.left{border-right:1px solid var(--line);background:#1c1f1c}.arrange{position:relative;background:#191c19}.corner{height:34px;position:sticky;top:0;z-index:5;background:#222622;border-bottom:1px solid var(--line);padding:9px 12px;color:var(--muted);font-size:10px;letter-spacing:.1em}.timeline-head{height:34px;position:sticky;top:0;z-index:4;min-width:1400px;background:#222622;border-bottom:1px solid var(--line);display:flex}.bar{height:34px;flex:none;width:var(--barW);border-left:1px solid var(--line);padding:8px 7px;color:#aeb6a9;font-size:10px;font-variant-numeric:tabular-nums}.track-head{height:var(--trackH);border-bottom:1px solid var(--line);padding:13px 12px;position:relative}.track-name{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.track-kind{font-size:10px;color:var(--muted);margin:3px 0 10px}.track-head button{padding:3px 7px;font-size:10px;margin-right:4px}.track-head .arm.armed{background:#693b36;color:#fff;border-color:#ae6358}.track-head .mute.on,.track-head .solo.on{background:#494e38;border-color:#8d985d}.grid-lane{height:var(--trackH);border-bottom:1px solid var(--line);position:relative;min-width:1400px;background-image:linear-gradient(to right,transparent calc(var(--barW) - 1px),#303630 calc(var(--barW) - 1px),#303630 var(--barW));background-size:var(--barW) 100%}.grid-lane:before{content:"";position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(to right,transparent calc(var(--barW)/4 - 1px),#242924 calc(var(--barW)/4 - 1px),#242924 calc(var(--barW)/4));background-size:calc(var(--barW)/4) 100%;opacity:.8}.clip{position:absolute;top:12px;height:70px;border-radius:6px;overflow:hidden;border:1px solid color-mix(in srgb,var(--clip) 80%,white);background:color-mix(in srgb,var(--clip) 18%,#252925);box-shadow:inset 3px 0 var(--clip);cursor:grab;min-width:28px;touch-action:none}.clip:active{cursor:grabbing}.clip canvas{width:100%;height:45px;display:block;opacity:.9;pointer-events:none}.clip-label{padding:4px 7px 0;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#f0f1e9;pointer-events:none}.playhead{position:absolute;z-index:3;top:34px;bottom:0;width:1px;background:var(--accent);pointer-events:none;box-shadow:0 0 6px #c5d366}.playhead:before{content:"";position:absolute;top:-1px;left:-4px;width:9px;height:9px;background:var(--accent);transform:rotate(45deg)}.empty{height:100%;display:grid;place-items:center;min-width:100%;color:var(--soft);font-size:12px;pointer-events:none}.bottom{height:40px;display:flex;align-items:center;gap:18px;padding:0 15px;border-top:1px solid var(--line);background:#1e211e;color:var(--muted);font-size:10px}.bottom span:first-child{color:var(--accent)}.status{margin-left:auto}.toast{position:fixed;bottom:56px;left:50%;transform:translateX(-50%);background:#353b32;border:1px solid #59624f;color:var(--text);border-radius:8px;padding:9px 14px;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none}.toast.show{opacity:1}.hidden{display:none!important}@media(max-width:900px){:root{--labelW:150px;--barW:92px}.top{gap:12px;padding:0 10px}.tools{overflow-x:auto}.saved{display:none}}
</style></head><body>
<div class="app">
<header class="top"><div class="brand"><i></i>NEUSIC STUDIO</div><div class="project-name" id="projectName">Untitled Session</div><div class="top-spacer"></div><span class="saved" id="saveState">Local session</span><button class="subtle" id="saveBtn">Save project</button><button class="subtle" id="openBtn">Open</button><input class="hidden" id="openFile" type="file" accept=".neusic,application/json"></header>
<section class="transport" aria-label="Transport"><button id="toStart" title="Return to start">|◀</button><button class="play" id="playBtn" title="Space">▶</button><button id="stopBtn">■</button><button class="record" id="recordBtn" title="Record microphone">●</button><div class="readout"><b id="position">001.01.000</b><small>BAR · BEAT · TICK</small></div><span class="tempo-label">TEMPO</span><input class="tempo" id="bpm" type="number" min="40" max="240" value="112"><span class="tempo-label">BPM</span><button id="loopBtn" title="Toggle loop playback">↻ Loop</button></section>
<nav class="tools"><button class="primary" id="addAudio">＋ Audio track</button><button id="addMidi">＋ Instrument track</button><button class="import" id="importBtn">Import audio</button><input id="audioFiles" class="hidden" type="file" accept="audio/*" multiple><button id="exportBtn">Export mix</button><span class="right">Drag clips to arrange · Shift+wheel to scroll timeline</span></nav>
<main class="workspace"><aside class="left" id="trackList"><div class="corner">TRACKS</div></aside><section class="arrange" id="arrange"><div class="timeline-head" id="ruler"></div><div class="playhead" id="playhead"></div><div id="lanes"></div></section></main>
<footer class="bottom"><span>● AUDIO ENGINE READY</span><span id="trackCount">0 tracks</span><span>44.1 kHz · Browser Audio</span><span class="status" id="hint">Import a sample or record a take to begin.</span></footer>
</div><div class="toast" id="toast"></div>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id), BAR=2.0, BARPX=112, TRACK_H=94, COLORS=['#84c7c4','#c5d36a','#b9a0d9','#e4a46e','#88a8d6','#dc8a8c'];
let ctx=null, master=null, tracks=[], sources=[], playing=false, startAt=0, offset=0, raf=0, rec=null, mic=null, recChunks=[], recTrack=null, loopOn=false, loopEnd=16, project='Untitled Session';
const AC=window.AudioContext||window.webkitAudioContext;
function audio(){if(!ctx){ctx=new AC();master=ctx.createGain();master.gain.value=.82;master.connect(ctx.destination)}if(ctx.state==='suspended')ctx.resume();return ctx}
function say(s){$('hint').textContent=s;$('toast').textContent=s;$('toast').classList.add('show');clearTimeout(say.t);say.t=setTimeout(()=>$('toast').classList.remove('show'),2100)}
function secPerBar(){return 240/Math.max(40,Math.min(240,Number($('bpm').value)||112))}
function fmt(t){const b=Math.floor(t/secPerBar()),beat=Math.floor((t%secPerBar())/(secPerBar()/4)),tick=Math.floor((((t%secPerBar())%(secPerBar()/4))/(secPerBar()/4))*960);return `${String(b+1).padStart(3,'0')}.${String(beat+1).padStart(2,'0')}.${String(tick).padStart(3,'0')}`}
function ensureBars(n=32){while($('ruler').children.length<n){let i=$('ruler').children.length;let x=document.createElement('div');x.className='bar';x.textContent=String(i+1).padStart(2,'0');$('ruler').append(x)}document.querySelectorAll('.grid-lane').forEach(x=>x.style.width=`${n*BARPX}px`)}
function newTrack(name,type='Audio'){let t={id:crypto.randomUUID(),name,type,color:COLORS[tracks.length%COLORS.length],gain:.8,pan:0,mute:false,solo:false,armed:false,clips:[]};tracks.push(t);render();return t}
function drawWave(canvas,buffer,color){const dpr=devicePixelRatio||1,w=canvas.clientWidth,h=canvas.clientHeight;if(!w)return;canvas.width=w*dpr;canvas.height=h*dpr;let g=canvas.getContext('2d');g.scale(dpr,dpr);g.strokeStyle=color;g.globalAlpha=.85;g.lineWidth=1;let data=buffer.getChannelData(0),step=Math.max(1,Math.floor(data.length/w));g.beginPath();for(let x=0;x<w;x++){let lo=1,hi=-1;for(let j=0;j<step;j++){let v=data[x*step+j]||0;if(v<lo)lo=v;if(v>hi)hi=v}g.moveTo(x,h/2+lo*h*.42);g.lineTo(x,h/2+hi*h*.42)}g.stroke()}
function render(){ensureBars(Math.max(32,...tracks.flatMap(t=>t.clips.map(c=>Math.ceil((c.start+c.duration)/secPerBar())+4))));let list=$('trackList'),lanes=$('lanes');list.querySelectorAll('.track-head').forEach(n=>n.remove());lanes.innerHTML='';for(const t of tracks){let h=document.createElement('div');h.className='track-head';h.innerHTML=`<div class="track-name" title="Double click to rename">${escapeHtml(t.name)}</div><div class="track-kind">${t.type} · ${t.clips.length} clip${t.clips.length===1?'':'s'}</div><button class="arm ${t.armed?'armed':''}" data-a="arm">REC</button><button class="mute ${t.mute?'on':''}" data-a="mute">M</button><button class="solo ${t.solo?'on':''}" data-a="solo">S</button>`;h.querySelector('[data-a=arm]').onclick=()=>{t.armed=!t.armed;render()};h.querySelector('[data-a=mute]').onclick=()=>{t.mute=!t.mute;render()};h.querySelector('[data-a=solo]').onclick=()=>{t.solo=!t.solo;render()};h.querySelector('.track-name').ondblclick=()=>{let n=prompt('Track name',t.name);if(n?.trim()){t.name=n.trim();render()}};list.append(h);let lane=document.createElement('div');lane.className='grid-lane';lane.style.width=$('ruler').style.width||'3584px';for(const c of t.clips){let el=document.createElement('div');el.className='clip';el.style.setProperty('--clip',t.color);el.style.left=`${c.start/secPerBar()*BARPX}px`;el.style.width=`${Math.max(36,c.duration/secPerBar()*BARPX)}px`;let label=document.createElement('div');label.className='clip-label';label.textContent=c.name;let cv=document.createElement('canvas');el.append(label,cv);lane.append(el);drawWave(cv,c.buffer,t.color);el.addEventListener('pointerdown',e=>{if(e.target!==el&&e.target!==label&&e.target!==cv)return;let x=e.clientX,initial=c.start;el.setPointerCapture(e.pointerId);el.onpointermove=ev=>{c.start=Math.max(0,initial+(ev.clientX-x)/BARPX*secPerBar());el.style.left=`${c.start/secPerBar()*BARPX}px`;$('position').textContent=fmt(c.start)};el.onpointerup=()=>{el.onpointermove=null;render()}})}lanes.append(lane)}$('trackCount').textContent=`${tracks.length} track${tracks.length===1?'':'s'}`;$('projectName').textContent=project}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function importFiles(files){if(!files.length)return;let c=audio();for(const f of files){try{let b=await c.decodeAudioData(await f.arrayBuffer());let t=tracks.at(-1);if(!t||t.type!=='Audio')t=newTrack('Audio '+(tracks.length+1));t.clips.push({id:crypto.randomUUID(),name:f.name,buffer:b,start:0,duration:b.duration});render();say(`Imported ${f.name}`)}catch(e){say(`Could not decode ${f.name}`)}}}
function clearSources(){for(const s of sources){try{s.stop()}catch(_){}}sources=[]}
function play(){if(playing){pause();return}let c=audio();playing=true;startAt=c.currentTime;for(const t of tracks){if(t.mute||tracks.some(x=>x.solo)&&!t.solo)continue;for(const cl of t.clips){if(cl.start+cl.duration<=offset)continue;let s=c.createBufferSource(),g=c.createGain(),p=c.createStereoPanner();s.buffer=cl.buffer;g.gain.value=t.gain;p.pan.value=t.pan;s.connect(g).connect(p).connect(master);let when=c.currentTime+Math.max(0,cl.start-offset),at=Math.max(0,offset-cl.start);s.start(when,at);sources.push(s)}}$('playBtn').textContent='Ⅱ';tick()}
function pause(){if(!playing)return;offset+=audio().currentTime-startAt;playing=false;clearSources();cancelAnimationFrame(raf);$('playBtn').textContent='▶';tick()}
function stop(){playing=false;clearSources();cancelAnimationFrame(raf);offset=0;$('playBtn').textContent='▶';tick()}
function tick(){let elapsed=playing?offset+audio().currentTime-startAt:offset;$('position').textContent=fmt(elapsed);$('playhead').style.left=`${elapsed/secPerBar()*BARPX}px`;if(playing){let loopSeconds=loopEnd*secPerBar();if(loopOn&&elapsed>=loopSeconds){offset=0;playing=false;play()}else if(tracks.length&&elapsed>Math.max(8,...tracks.flatMap(t=>t.clips.map(c=>c.start+c.duration)))+1){stop()}else raf=requestAnimationFrame(tick)}}
function wav(buffer){let channels=buffer.numberOfChannels,rate=buffer.sampleRate,len=buffer.length,bytes=44+len*channels*2,ab=new ArrayBuffer(bytes),v=new DataView(ab),o=0;function str(s){for(let c of s)v.setUint8(o++,c.charCodeAt(0))}function u16(x){v.setUint16(o,x,true);o+=2}function u32(x){v.setUint32(o,x,true);o+=4}str('RIFF');u32(bytes-8);str('WAVE');str('fmt ');u32(16);u16(1);u16(channels);u32(rate);u32(rate*channels*2);u16(channels*2);u16(16);str('data');u32(bytes-44);let data=Array.from({length:channels},(_,i)=>buffer.getChannelData(i));for(let i=0;i<len;i++)for(let ch=0;ch<channels;ch++){let x=Math.max(-1,Math.min(1,data[ch][i]));v.setInt16(o,x<0?x*32768:x*32767,true);o+=2}return new Blob([ab],{type:'audio/wav'})}
async function exportMix(){if(!tracks.some(t=>t.clips.length)){say('Add clips before exporting.');return}let dur=Math.max(...tracks.flatMap(t=>t.clips.map(c=>c.start+c.duration))),rate=44100,off=new OfflineAudioContext(2,Math.ceil((dur+.2)*rate),rate),out=off.createGain();out.gain.value=.86;out.connect(off.destination);for(const t of tracks){if(t.mute||tracks.some(x=>x.solo)&&!t.solo)continue;for(const cl of t.clips){let s=off.createBufferSource(),g=off.createGain(),p=off.createStereoPanner();s.buffer=cl.buffer;g.gain.value=t.gain;p.pan.value=t.pan;s.connect(g).connect(p).connect(out);s.start(cl.start)}}say('Rendering WAV mix…');let b=await off.startRendering(),blob=wav(b),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=(project.toLowerCase().replace(/[^a-z0-9]+/g,'-')||'neusic-session')+'.wav';a.click();URL.revokeObjectURL(a.href);say('WAV mix exported.')}
function save(){let payload={format:'neusic-session',version:1,project,bpm:Number($('bpm').value),tracks:tracks.map(t=>({id:t.id,name:t.name,type:t.type,color:t.color,gain:t.gain,pan:t.pan,mute:t.mute,solo:t.solo,clips:t.clips.map(c=>({name:c.name,start:c.start,duration:c.duration,channels:Array.from({length:c.buffer.numberOfChannels},(_,i)=>Array.from(c.buffer.getChannelData(i))),sampleRate:c.buffer.sampleRate}))}))};let blob=new Blob([JSON.stringify(payload)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=(project.replace(/[^a-z0-9]+/gi,'-')||'neusic-project')+'.neusic';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);say('Project saved as a portable .neusic file.')}
async function openProject(file){let p=JSON.parse(await file.text());if(p.format!=='neusic-session')throw Error('This is not a Neusic session.');let c=audio();project=p.project||'Untitled Session';$('bpm').value=p.bpm||112;tracks=[];for(const x of p.tracks||[]){let t={...x,clips:[]};for(const cl of x.clips||[]){let b=c.createBuffer(cl.channels.length,cl.channels[0].length,cl.sampleRate);cl.channels.forEach((arr,i)=>b.copyToChannel(Float32Array.from(arr),i));t.clips.push({name:cl.name,start:cl.start,duration:cl.duration,buffer:b})}tracks.push(t)}render();say('Project opened.')}
function bind(){ $('addAudio').onclick=()=>newTrack('Audio '+(tracks.length+1));$('addMidi').onclick=()=>{let t=newTrack('Instrument '+(tracks.length+1),'Instrument');say('Instrument lane added. MIDI note editing is not in this first Studio build.')};$('importBtn').onclick=()=>$('audioFiles').click();$('audioFiles').onchange=e=>importFiles([...e.target.files]);$('playBtn').onclick=play;$('stopBtn').onclick=stop;$('toStart').onclick=()=>{stop()};$('bpm').onchange=()=>{render();tick()};$('loopBtn').onclick=()=>{$('loopBtn').classList.toggle('primary');loopOn=!loopOn;say(loopOn?'Loop playback enabled.':'Loop playback disabled.')};$('exportBtn').onclick=()=>exportMix().catch(e=>say(e.message));$('saveBtn').onclick=save;$('openBtn').onclick=()=>$('openFile').click();$('openFile').onchange=e=>{if(e.target.files[0])openProject(e.target.files[0]).catch(x=>say(x.message))};$('recordBtn').onclick=recordToggle;document.addEventListener('keydown',e=>{if(e.code==='Space'&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName)){e.preventDefault();play()}});$('arrange').addEventListener('wheel',e=>{if(e.shiftKey){$('arrange').scrollLeft+=e.deltaY;e.preventDefault()}},{passive:false})}
async function recordToggle(){try{if(rec?.state==='recording'){rec.stop();$('recordBtn').textContent='●';return}let t=tracks.find(x=>x.armed)||tracks.at(-1);if(!t||t.type!=='Audio')t=newTrack('Audio '+(tracks.length+1));let stream=await navigator.mediaDevices.getUserMedia({audio:true});mic=stream;recTrack=t;recChunks=[];rec=new MediaRecorder(stream);rec.ondataavailable=e=>{if(e.data.size)recChunks.push(e.data)};rec.onstop=async()=>{try{let blob=new Blob(recChunks,{type:rec.mimeType||'audio/webm'}),buf=await audio().decodeAudioData(await blob.arrayBuffer());t.clips.push({name:'Mic take',buffer:buf,start:offset,duration:buf.duration});render();say('Recording added to arrangement.')}catch(_){say('Recording could not be decoded in this browser.')}stream.getTracks().forEach(x=>x.stop())};rec.start();$('recordBtn').textContent='■';say('Recording microphone… Click the red button to stop.')}catch(e){say(e.message||'Microphone permission is unavailable.')}}
bind();ensureBars();newTrack('Audio 1');newTrack('Audio 2');
})();
</script></body></html>
