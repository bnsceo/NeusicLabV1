<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#10171d">
  <meta name="robots" content="noindex">
  <title>Neusical Suite · Development preview</title>
  <link rel="icon" href="../favicon.svg">
  <link rel="stylesheet" href="suite.css">
</head>
<body>
  <header class="suite-header">
    <a class="brand" href="#live" aria-label="Neusical Suite Live Loop"><img src="../favicon.svg" alt=""><span>NEUSICAL SUITE</span></a>
    <nav aria-label="Workspaces"><button data-view="live" class="active">LIVE LOOP</button><button data-view="loom">WAVE LOOM</button><button data-view="studio">STUDIO</button></nav>
    <div class="project-tools"><input id="project-name" aria-label="Project name" value="Untitled session" maxlength="60"><button id="save-project" title="Download a portable project with all separate recordings">Save project</button><button id="open-project">Open</button><button id="new-project">New</button></div>
  </header>
  <section class="transport" aria-label="Transport">
    <div class="transport-buttons"><button id="play" class="play"><span>▶</span> PLAY</button><button id="stop"><span>■</span> STOP</button><button id="record" class="record"><span>●</span> RECORD</button></div>
    <label class="tempo">TEMPO <span><input id="bpm" type="number" min="40" max="220" value="112" aria-label="Project tempo"> BPM</span></label>
    <div class="signature"><small>TIME SIGNATURE</small><strong>4 / 4</strong></div>
    <label class="bars">LOOP LENGTH<select id="loop-bars" aria-label="Loop length"><option value="1">1 bar</option><option value="2">2 bars</option><option value="4" selected>4 bars</option><option value="8">8 bars</option></select></label>
    <div class="input-block"><button id="mic" title="Enable or release microphone">MIC OFF</button><div class="meter" aria-label="Microphone input level"><i id="input-level"></i></div></div>
    <div class="position"><small id="transport-mode">STOPPED</small><strong id="position">01 : 1 : 00</strong></div>
    <div class="session-actions"><button id="undo" title="Undo last edit">↶ Undo</button><button id="redo" title="Redo last edit">↷ Redo</button><button id="import">Import audio</button></div>
  </section>
  <main id="workspace" tabindex="-1"></main>
  <footer><span class="status-dot"></span><span id="status" role="status" aria-live="polite">Opening your local project…</span><span id="save-state">LOCAL PROJECT</span><span class="preview-badge">DEVELOPMENT PREVIEW</span></footer>
  <input id="audio-file" type="file" accept="audio/*" hidden>
  <input id="project-file" type="file" accept=".neusic,application/json" hidden>
  <dialog id="session-dialog"><form method="dialog"><div class="section-heading"><h2>Your local sessions</h2><button aria-label="Close session picker">✕</button></div><p>Saved on this browser. Export a project file for a portable backup.</p><div id="session-list"></div><button type="button" id="import-project-file">Open a .neusic file</button></form></dialog>
  <script type="module" src="app.js"></script>
</body>
</html>
